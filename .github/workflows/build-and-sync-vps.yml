name: Build Mobile Apps (APK & IPA) and Sync to VPS

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # =========================================================================
  # JOB 1: Validate Web Application & Mobile Shell
  # =========================================================================
  validate-web:
    name: Validate Web & Mobile Assets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - name: Install Root Dependencies
        run: npm ci

      - name: Run Automated Test Suite (QA Gate)
        run: npm test

      - name: Build Mobile Web Bundle (dist)
        run: npm run build

      - name: Verify Mobile Web Output
        run: |
          if [ ! -f dist/index.html ]; then
            echo "::error::Mobile web bundle failed: dist/index.html was not generated!"
            exit 1
          fi
          echo "✅ Mobile web bundle verified: dist/index.html ($(wc -c < dist/index.html) bytes)"

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Next.js Web App
        working-directory: frontend
        run: npm run build

      - name: Web Application Build Success
        run: echo "✅ Next.js web application built successfully with zero compilation errors."

  # =========================================================================
  # JOB 2: Build Android Debug APK (ubuntu-latest)
  # =========================================================================
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    needs: validate-web
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Install Root Dependencies
        run: npm ci

      - name: Build Mobile Web Assets
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Build Android Debug APK with Gradle
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Verify & Prepare APK Output
        run: |
          APK_SOURCE="android/app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK_SOURCE" ]; then
            echo "::error::Android APK build failed: $APK_SOURCE not found!"
            exit 1
          fi
          cp "$APK_SOURCE" app-latest.apk
          echo "✅ Prepared app-latest.apk ($(ls -lh app-latest.apk | awk '{print $5}'))"

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-latest-android-apk
          path: app-latest.apk
          retention-days: 14
          if-no-files-found: error

      - name: Mobile Artifact Ready Notice
        run: |
          echo "::notice title=Android APK Ready::Android APK compiled successfully. The APK artifact is ready for download in GitHub Actions Artifacts."

  # =========================================================================
  # JOB 3: Build iOS IPA (macos-14)
  # =========================================================================
  build-ios:
    name: Build iOS IPA
    runs-on: macos-15
    needs: validate-web
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Select Xcode Version
        run: |
          if [ -d "/Applications/Xcode_16.4.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.4.app
          elif [ -d "/Applications/Xcode.app" ]; then
            sudo xcode-select -s /Applications/Xcode.app
          elif [ -d "/Applications/Xcode_16.2.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.2.app
          fi
          xcodebuild -version

      - name: Install Root Dependencies
        run: npm ci

      - name: Build Mobile Web Assets
        run: npm run build

      - name: Sync Capacitor iOS
        run: npx cap sync ios

      - name: Build Xcode Archive (Unsigned)
        working-directory: ios/App
        run: |
          # Coba kompilasi archive untuk generic iOS device; jika platform device belum terinstal di runner, fallback otomatis ke generic iOS Simulator
          xcodebuild archive \
            -project App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$PWD/build/App.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            SKIP_INSTALL=NO \
            || \
          xcodebuild archive \
            -project App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination "generic/platform=iOS Simulator" \
            -archivePath "$PWD/build/App.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            SKIP_INSTALL=NO \
            || \
          xcodebuild build \
            -project App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath "$PWD/build/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Verify Archive & Package Payload into app-latest.ipa
        working-directory: ios/App
        run: |
          APP_DIR=$(find build -name "*.app" -type d | head -n 1)
          if [ -z "$APP_DIR" ] || [ ! -d "$APP_DIR" ]; then
            echo "::error::Xcode build failed: No compiled .app bundle found in build directory!"
            exit 1
          fi
          echo "📦 Menemukan compiled app bundle di: $APP_DIR"
          mkdir -p build/Payload
          cp -R "$APP_DIR" build/Payload/
          cd build
          zip -qr ../../../app-latest.ipa Payload
          cd ../../..
          if [ ! -f app-latest.ipa ]; then
            echo "::error::IPA packaging failed: app-latest.ipa not found!"
            exit 1
          fi
          echo "✅ Prepared app-latest.ipa ($(ls -lh app-latest.ipa | awk '{print $5}'))"

      - name: Upload iOS IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-latest-ios-ipa
          path: app-latest.ipa
          retention-days: 14
          if-no-files-found: error

      - name: iOS Unsigned Build Notice
        run: |
          echo "::notice title=iOS IPA Signing Status::The compiled iOS IPA artifact (app-latest.ipa) is an UNSIGNED build for CI verification, static analysis, and re-signing. It cannot be installed directly onto non-jailbroken physical iOS devices without an Apple Developer certificate, provisioning profile, and valid code signature."

  # =========================================================================
  # JOB 4: Sync Mobile Artifacts to VPS (optional/conditional)
  # =========================================================================
  sync-vps:
    name: Sync Mobile Binaries to VPS
    runs-on: ubuntu-latest
    needs: [build-android, build-ios]
    if: always() && github.ref == 'refs/heads/main' && (needs.build-android.result == 'success' || needs.build-ios.result == 'success')
    steps:
      - name: Download Android APK Artifact
        if: needs.build-android.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: app-latest-android-apk
          path: ./sync-artifacts

      - name: Download iOS IPA Artifact
        if: needs.build-ios.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: app-latest-ios-ipa
          path: ./sync-artifacts

      - name: Sync Artifacts to VPS via Secure SSH/SCP
        continue-on-error: true
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USERNAME: ${{ secrets.VPS_USERNAME || 'ubuntu' }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_PORT: ${{ secrets.VPS_SSH_PORT || secrets.VPS_PORT || '2222' }}
          VPS_TARGET_DIR: ${{ secrets.VPS_TARGET_DIR || '/home/ubuntu/downloads' }}
        run: |
          if [ -z "$VPS_HOST" ] || [ -z "$VPS_SSH_KEY" ]; then
            echo "::warning title=VPS Sync Skipped::VPS secrets (VPS_HOST, VPS_SSH_KEY) are not configured. Skipping VPS synchronization."
            exit 0
          fi

          echo "🚀 Configuring SSH client with verified host keys..."
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          # Load private key safely with newline
          printf '%s\n' "$VPS_SSH_KEY" | tr -d '\r' > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

          echo "📂 Resolving and ensuring remote target directory exists..."
          ACTUAL_TARGET_DIR=$(ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o LogLevel=ERROR -o ConnectTimeout=15 -p "$VPS_PORT" -i ~/.ssh/id_rsa "$VPS_USERNAME@$VPS_HOST" "TARGET_INPUT='$VPS_TARGET_DIR' bash -s" << 'EOF'
            TARGET="$TARGET_INPUT"

            # 1. Try regular mkdir
            if mkdir -p "$TARGET" 2>/dev/null && [ -w "$TARGET" ]; then
              echo "$TARGET"
              exit 0
            fi

            # 2. If permission denied, attempt sudo if available
            if command -v sudo >/dev/null 2>&1; then
              sudo -n mkdir -p "$TARGET" 2>/dev/null || true
              sudo -n chown -R "$(whoami):$(whoami)" "$TARGET" 2>/dev/null || true
              if [ -d "$TARGET" ] && [ -w "$TARGET" ]; then
                echo "$TARGET"
                exit 0
              fi
            fi

            # 3. Resilient fallback to user home downloads
            FALLBACK="$HOME/downloads"
            mkdir -p "$FALLBACK" 2>/dev/null || true
            echo "$FALLBACK"
          EOF
          )
          ACTUAL_TARGET_DIR=$(echo "$ACTUAL_TARGET_DIR" | tr -d '\r' | tail -n 1)
          if [ -z "$ACTUAL_TARGET_DIR" ]; then
            ACTUAL_TARGET_DIR="/home/$VPS_USERNAME/downloads"
          fi
          echo "✅ Remote target directory verified: $ACTUAL_TARGET_DIR"

          # Upload Android APK if present using atomic write (.tmp -> mv)
          if [ -f "./sync-artifacts/app-latest.apk" ]; then
            echo "📤 Uploading app-latest.apk atomically..."
            scp -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o LogLevel=ERROR -P "$VPS_PORT" -i ~/.ssh/id_rsa ./sync-artifacts/app-latest.apk "$VPS_USERNAME@$VPS_HOST:$ACTUAL_TARGET_DIR/app-latest.apk.tmp"
            ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o LogLevel=ERROR -p "$VPS_PORT" -i ~/.ssh/id_rsa "$VPS_USERNAME@$VPS_HOST" "mv '$ACTUAL_TARGET_DIR/app-latest.apk.tmp' '$ACTUAL_TARGET_DIR/app-latest.apk'"
            echo "✅ app-latest.apk synchronized to VPS."
          fi

          # Upload iOS IPA if present using atomic write (.tmp -> mv)
          if [ -f "./sync-artifacts/app-latest.ipa" ]; then
            echo "📤 Uploading app-latest.ipa atomically..."
            scp -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o LogLevel=ERROR -P "$VPS_PORT" -i ~/.ssh/id_rsa ./sync-artifacts/app-latest.ipa "$VPS_USERNAME@$VPS_HOST:$ACTUAL_TARGET_DIR/app-latest.ipa.tmp"
            ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o LogLevel=ERROR -p "$VPS_PORT" -i ~/.ssh/id_rsa "$VPS_USERNAME@$VPS_HOST" "mv '$ACTUAL_TARGET_DIR/app-latest.ipa.tmp' '$ACTUAL_TARGET_DIR/app-latest.ipa'"
            echo "✅ app-latest.ipa synchronized to VPS."
          fi

          echo "🔍 Post-sync verification on VPS:"
          ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o LogLevel=ERROR -p "$VPS_PORT" -i ~/.ssh/id_rsa "$VPS_USERNAME@$VPS_HOST" "ls -lh '$ACTUAL_TARGET_DIR'/app-latest.* 2>/dev/null || true"

          # Mirror to web app's public/downloads so files can also be served via HTTPS
          ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o LogLevel=ERROR -p "$VPS_PORT" -i ~/.ssh/id_rsa "$VPS_USERNAME@$VPS_HOST" "SOURCE_DIR='$ACTUAL_TARGET_DIR' bash -s" << 'EOF'
            for dir in "/home/ubuntu/platform-repos/Recuiter-Industrial" "/home/ubuntu/platform-repos/recruiter-industrial" "/home/ubuntu/Recuiter-Industrial" "/home/ubuntu/recruiter-industrial" "/var/www/recruiter"; do
              if [ -d "$dir/frontend/public" ]; then
                mkdir -p "$dir/frontend/public/downloads" 2>/dev/null || true
                cp -f "$SOURCE_DIR"/app-latest.* "$dir/frontend/public/downloads/" 2>/dev/null || true
                echo "🌐 Mirrored mobile artifacts to: $dir/frontend/public/downloads"
                break
              fi
            done
          EOF

          # Clean up private key
          rm -f ~/.ssh/id_rsa
          echo "🎉 VPS synchronization completed successfully."

  # =========================================================================
  # JOB 5: Auto-Deploy Web Application to VPS
  # =========================================================================
  deploy-web:
    name: Deploy Web Application to VPS
    runs-on: ubuntu-latest
    needs: validate-web
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Deploy to VPS via Secure SSH
        continue-on-error: true
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USERNAME: ${{ secrets.VPS_USERNAME || 'ubuntu' }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_PORT: ${{ secrets.VPS_SSH_PORT || secrets.VPS_PORT || '2222' }}
          VPS_PROJECT_DIR: ${{ secrets.VPS_PROJECT_DIR || '/home/ubuntu/platform-repos/Recuiter-Industrial' }}
        run: |
          if [ -z "$VPS_HOST" ] || [ -z "$VPS_SSH_KEY" ]; then
            echo "::warning title=Auto-Deploy Skipped::GitHub Secrets (VPS_HOST, VPS_SSH_KEY) belum dikonfigurasi di GitHub Repository Secrets. Melewati deploy otomatis web ke VPS."
            exit 0
          fi

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" | tr -d '\r' > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

          echo "🚀 Menghubungi VPS $VPS_HOST untuk update kode web & build..."
          ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=15 -p "$VPS_PORT" -i ~/.ssh/id_rsa "$VPS_USERNAME@$VPS_HOST" "bash -s" << 'EOF'
            set -e

            # Pastikan NVM, Node.js, npm, dan PM2 tersedia di PATH non-interaktif
            export NVM_DIR="$HOME/.nvm"
            if [ -s "$NVM_DIR/nvm.sh" ]; then
              \. "$NVM_DIR/nvm.sh"
            fi
            export PATH="$PATH:$HOME/.nvm/versions/node/$(ls $HOME/.nvm/versions/node 2>/dev/null | tail -n 1)/bin:/usr/local/bin:/usr/bin:$HOME/.npm-global/bin:$HOME/.local/bin"
            source ~/.profile 2>/dev/null || true

            TARGET_DIR=""
            for dir in "/home/ubuntu/platform-repos/Recuiter-Industrial" "/home/ubuntu/platform-repos/recruiter-industrial" "/home/ubuntu/Recuiter-Industrial" "/home/ubuntu/recruiter-industrial" "/var/www/recruiter"; do
              if [ -d "$dir" ]; then
                TARGET_DIR="$dir"
                break
              fi
            done

            if [ -z "$TARGET_DIR" ]; then
              TARGET_DIR=$(find /home/ubuntu -maxdepth 3 -name ".git" -exec dirname {} \; 2>/dev/null | grep -i "recruiter" | head -n 1 || true)
            fi

            if [ -n "$TARGET_DIR" ] && [ -d "$TARGET_DIR" ]; then
              echo "📂 Direktori project ditemukan di: $TARGET_DIR"
              cd "$TARGET_DIR"

              # Perbaiki kepemilikan file & permission jika direktori sempat disentuh proses root
              if command -v sudo >/dev/null 2>&1; then
                sudo -n chown -R "$(whoami):$(whoami)" "$TARGET_DIR" 2>/dev/null || true
              fi
              git config --global --add safe.directory "$TARGET_DIR" 2>/dev/null || true

              echo "📥 Menjalankan git pull origin main..."
              git pull origin main || (git fetch origin main && git reset --hard origin/main)

              if [ -d "frontend" ]; then
                cd frontend
                echo "📦 Memperbarui dependencies & build Next.js..."
                npm install --prefer-offline || npm install
                NODE_OPTIONS="--max-old-space-size=1536" npm run build
                cd ..
              fi

              # Jalankan PocketBase migration & OAuth jika ada (coba port 8093 lalu 8090)
              if [ -f "backend/configure-oauth.mjs" ]; then
                echo "⚙️ Memperbarui konfigurasi OAuth PocketBase..."
                node backend/configure-oauth.mjs http://127.0.0.1:8093 || node backend/configure-oauth.mjs http://127.0.0.1:8090 || true
              fi

              # Restart service jika menggunakan PM2 atau systemd
              echo "🔄 Me-restart service web..."
              if command -v pm2 &>/dev/null; then
                pm2 reload all || pm2 restart all || true
              fi
              if command -v systemctl &>/dev/null; then
                sudo systemctl restart recruiter-industrial-frontend 2>/dev/null || sudo systemctl restart recruiter 2>/dev/null || true
              fi

              echo "🎉 Aplikasi web di VPS berhasil di-update ke versi terbaru!"
            else
              echo "⚠️ Direktori project belum ditemukan di lokasi umum VPS. Silakan cek letak folder project Anda."
            fi
          EOF

          rm -f ~/.ssh/id_rsa
