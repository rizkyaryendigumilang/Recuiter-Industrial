<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Mode Offline — Recruiter Industrial</title>
  <link rel="icon" href="/favicon.png">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #FAFAFA;
      color: #0F172A;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100dvh;
      padding: 24px;
      padding-top: max(24px, env(safe-area-inset-top));
      padding-bottom: max(24px, env(safe-area-inset-bottom));
    }
    .card {
      background: #FFFFFF;
      border: 1px solid #E2E8F0;
      border-radius: 24px;
      padding: 40px 32px;
      max-width: 420px;
      width: 100%;
      text-align: center;
      box-shadow: 0 4px 20px -2px rgba(15, 23, 42, 0.05);
    }
    .logo-badge {
      width: 48px;
      height: 48px;
      margin: 0 auto 20px;
      background: #0F172A;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      font-size: 14px;
      color: #FFFFFF;
      letter-spacing: 0.05em;
    }
    .logo-badge span { color: #F59E0B; }
    h1 {
      font-size: 20px;
      font-weight: 800;
      color: #0F172A;
      letter-spacing: -0.02em;
      margin-bottom: 8px;
    }
    p {
      font-size: 13px;
      line-height: 1.6;
      color: #64748B;
      margin-bottom: 24px;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 44px;
      padding: 0 20px;
      background: #0F172A;
      color: #FFFFFF;
      text-decoration: none;
      font-size: 13px;
      font-weight: 600;
      border-radius: 12px;
      border: none;
      cursor: pointer;
      transition: opacity 0.15s ease;
      touch-action: manipulation;
    }
    .btn:active {
      opacity: 0.85;
      transform: scale(0.98);
    }
    .badge {
      display: inline-block;
      font-size: 11px;
      font-family: monospace;
      padding: 4px 12px;
      border-radius: 9999px;
      background: #F1F5F9;
      color: #475569;
      margin-top: 20px;
      border: 1px solid #E2E8F0;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo-badge"><span>R</span>I</div>
    <h1>Koneksi Sedang Terputus</h1>
    <p>Aplikasi Recruiter Industrial sedang tidak terhubung ke internet. Anda masih dapat membuka halaman yang telah tersimpan di memori cache ponsel.</p>
    <button class="btn" onclick="window.location.reload()">Coba Muat Ulang</button>
    <div>
      <span class="badge">PWA OFFLINE CACHE v2.6</span>
    </div>
  </div>
</body>
</html>
