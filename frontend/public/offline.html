<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mode Offline — Recruiter Industrial</title>
  <link rel="icon" href="/favicon.png">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #FAFAFA;
      color: #0A0A0A;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
    }
    .card {
      background: #FFFFFF;
      border: 1px solid #E8E8EC;
      border-radius: 16px;
      padding: 36px 32px;
      max-width: 440px;
      width: 100%;
      text-align: center;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
    }
    .icon-container {
      width: 72px;
      height: 72px;
      margin: 0 auto 20px;
      background: #EEF2FF;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .icon-container svg {
      width: 36px;
      height: 36px;
      stroke: #6366F1;
    }
    h1 {
      font-size: 20px;
      font-weight: 700;
      color: #0A0A0A;
      margin-bottom: 8px;
    }
    p {
      font-size: 14px;
      line-height: 1.6;
      color: #6B6B6B;
      margin-bottom: 24px;
    }
    .btn {
      display: inline-block;
      width: 100%;
      padding: 12px 20px;
      background: #6366F1;
      color: #FFFFFF;
      text-decoration: none;
      font-size: 14px;
      font-weight: 600;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      transition: background 0.15s ease;
    }
    .btn:hover {
      background: #4F46E5;
    }
    .badge {
      display: inline-block;
      font-size: 12px;
      padding: 4px 10px;
      border-radius: 9999px;
      background: #F3F4F6;
      color: #4B5563;
      margin-top: 16px;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon-container">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" d="M3 15a4 4 0 004 4h9a5 5 0 10-.1-9.999 5.002 5.002 0 00-9.78 2.096A4.001 4.001 0 003 15z" />
        <line x1="2" y1="2" x2="22" y2="22" stroke="currentColor" stroke-width="2" />
      </svg>
    </div>
    <h1>Koneksi Terputus / You're Offline</h1>
    <p>Aplikasi sedang tidak terhubung ke internet. Beberapa data yang sudah tersimpan di cache tetap dapat diakses.</p>
    <button class="btn" onclick="window.location.reload()">Muat Ulang / Reload</button>
    <div class="badge">Recruiter Industrial PWA</div>
  </div>
</body>
</html>
